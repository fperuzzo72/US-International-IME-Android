name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle wrapper jar is deliberately not committed. Android Studio
      # generates it on first open; CI asks Gradle for the same thing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate the wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Regenerate layout tables and check they are in sync
        run: |
          python3 tools/gen_layout.py
          git diff --exit-code -- app/src/main/java/io/github/fperuzzo72/usintlime/UsIntlTables.kt

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: usintl-ime-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
