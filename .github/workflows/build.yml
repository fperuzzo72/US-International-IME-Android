name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle wrapper jar is deliberately not committed. Android Studio
      # generates it on first open; CI asks Gradle for the same thing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate the wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Regenerate layout tables and check they are in sync
        run: |
          python3 tools/gen_layout.py
          git diff --exit-code -- app/src/main/java/io/github/fperuzzo72/usintlime/UsIntlTables.kt

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease

      # Renamed here rather than in Gradle: AGP 8 has no supported way to set
      # the output file name, only APIs marked internal or already deprecated.
      # A local `./gradlew assembleRelease` still writes app-release.apk.
      - name: Name the APK
        run: mv app/build/outputs/apk/release/app-release.apk US-Intl-IME.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: usintl-ime
          path: US-Intl-IME.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: app/build/reports/tests/
